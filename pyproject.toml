[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-publication-audit"
version = "0.3.0"
description = "Dependency-free preflight checks before making a repository public"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "duy90utc528"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

[project.scripts]
repo-publication-audit = "repo_publication_audit.__main__:main"

[project.urls]
Homepage = "https://github.com/duy90utc528/repo-publication-audit"
Issues = "https://github.com/duy90utc528/repo-publication-audit/issues"

[tool.setuptools.packages.find]
include = ["repo_publication_audit*"]
